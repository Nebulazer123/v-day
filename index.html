<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1026">
<title>LAINIE.EXE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%221em%22 font-size=%2280%22>%F0%9F%A6%86</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<!-- persistent background layer -->
<canvas id="bg-starfield" class="bg-canvas" aria-hidden="true"></canvas>
<div class="crt-scanlines" aria-hidden="true"></div>
<div class="crt-vignette" aria-hidden="true"></div>

<!-- HUD (hidden until first screen after the Gatekeeper) -->
<header id="hud" class="hud" aria-hidden="true">
  <div class="hud__left" id="hud-logo" title="tap 7x for a surprise">&#9829; LAINIE.EXE</div>
  <div class="hud__right">
    <button class="hud__btn" id="hud-music" type="button" title="music: yes obviously">&#9834;</button>
    <button class="hud__btn" id="hud-sfx" type="button" title="sfx: on">&#128266;</button>
    <button class="hud__btn" id="hud-reset" type="button" title="start over">&#8634;</button>
  </div>
</header>

<!-- screens register themselves into here -->
<main id="app"></main>

<!-- cursor trail particle layer -->
<div id="trail-layer" class="trail-layer" aria-hidden="true"></div>

<!-- confetti canvas -->
<canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

<!-- duck-mode parade layer -->
<div id="duck-parade" class="duck-parade" aria-hidden="true"></div>

<!-- toast -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- start-over confirmation modal -->
<div id="restart-modal" class="modal-scrim hidden">
  <div class="win98">
    <div class="win98__title"><span>system32.exe</span></div>
    <div class="win98__body">Restart everything? All 200% of your progress will be lost.</div>
    <div class="win98__btnrow">
      <button class="btn btn--no" id="restart-yes" type="button">RESTART</button>
      <button class="btn btn--sys" id="restart-no" type="button">ok fine stay</button>
    </div>
  </div>
</div>

<script src="js/core.js?v=7"></script>
<script src="js/audio-assets.js?v=7"></script>
<script src="js/shell.js?v=7"></script>
<script src="js/gate.js?v=7"></script>
<script src="js/loading.js?v=7"></script>
<script src="js/quiz.js?v=7"></script>
<script src="js/games/level1_platformer.js?v=7"></script>
<script src="js/games/level2_fishing.js?v=7"></script>
<script src="js/games/level3_village.js?v=7"></script>
<script src="js/games/level4_twilight.js?v=7"></script>
<script src="js/arcade.js?v=7"></script>
<script src="js/finale.js?v=7"></script>
<script src="js/critters.js?v=7"></script>
<script src="js/eastereggs.js?v=7"></script>
<script src="js/skipbtn.js?v=7"></script>
<script src="js/boot.js?v=7"></script>
</body>
</html>
